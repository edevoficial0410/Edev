<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edev — Plataforma de Cursos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0A0A0A;
      color: #8A94A0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(28, 168, 227, 0.2);
      border-top-color: #1CA8E3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Redirecionamento automático: se já possui sessão salva, vai direto para o app; senão para a landing page
    const token = localStorage.getItem('edev_access_token');
    if (token) {
      window.location.replace('app.html');
    } else {
      window.location.replace('landing.html');
    }
  </script>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Carregando Edev...</p>
  </div>
</body>
</html>
